# Local nonkube: API container (mirrors Cloud Run). Uses postgres from docker-compose.local.yml.
# Prerequisite: docker compose -f docker-compose.local.yml -p fru_local up -d
# Usage: docker compose -f tools/local/docker/docker-compose.nonkube.yml -p fru_local up -d
services:
  api:
    image: fru-api:local
    container_name: fru-api-nonkube
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-fru_db}
      PORT: "5001"
      CLOUD_PROVIDER: local
      DEPLOY_SCOPE: nonkube
      DELTA_TABLE_PATH: file:///tmp/delta/fru_sales
      ENABLE_ANALYTICS_SCHEDULER: ${ENABLE_ANALYTICS_SCHEDULER:-true}
      ANALYTICS_SCHEDULER_INTERVAL_SECONDS: ${ANALYTICS_SCHEDULER_INTERVAL_SECONDS:-180}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      EMBEDDING_ACTIVE_PROFILE: ${EMBEDDING_ACTIVE_PROFILE:-openai_1536}
      # ModelArk (required when EMBEDDING_ACTIVE_PROFILE=skylark_2048) — from .env
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
      ARK_EMBEDDING_MODEL_ID: ${ARK_EMBEDDING_MODEL_ID:-}
      ARK_CHAT_MODEL_ID: ${ARK_CHAT_MODEL_ID:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-haiku-20241022}
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: "*"
      USE_AGENT_QUERY: ${USE_AGENT_QUERY:-true}
      EXEC_LOG_SQL_PREVIEW_MAX_CHARS: ${EXEC_LOG_SQL_PREVIEW_MAX_CHARS:-150}
    ports:
      - "5001:5001"
    volumes:
      - fru_delta:/tmp/delta

volumes:
  fru_delta: {}
