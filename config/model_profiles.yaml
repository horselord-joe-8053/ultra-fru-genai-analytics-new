# Model catalog: embedding lanes, chat models (concrete ids), and legit (embed, chat) stacks.
# Secrets (API keys) stay in .env only. Stack rows may restrict allowed_clouds.

embeddings:
  openai_1536:
    provider: openai
    model_slug: openai
    model_env: OPENAI_EMBED_MODEL
    dimension: 1536
    pgvector_column: embedding_openai_1536
  skylark_2048:
    provider: modelark
    model_slug: skylark
    model_env: ARK_EMBEDDING_MODEL_ID
    dimension: 2048
    pgvector_column: embedding_skylark_2048

chat:
  # ModelArk — pair only with skylark_2048
  deepseek_flash:
    inference: modelark
    model_id: deepseek-v4-flash-260425
    display: deepseek-v4-flash-260425
  deepseek_pro:
    inference: modelark
    model_id: deepseek-v4-pro-260425
    display: deepseek-v4-pro-260425
  seed_lite:
    inference: modelark
    model_id: seed-2-0-lite-260228
    display: seed-2-0-lite-260228
    model_env: ARK_CHAT_MODEL_ID
  seed_pro:
    inference: modelark
    model_id: seed-2-0-pro-260328
    display: seed-2-0-pro-260328
  # Claude — pair only with openai_1536
  # Per-profile model_id below is authoritative for catalog picks. CLAUDE_MODEL in .env is
  # deploy/doctor default only — not a shared override for all Claude profiles (REQ-7.3).
  claude_haiku:
    inference: claude
    model_id: claude-haiku-4-5
    display: claude-haiku-4-5
    bedrock_model_id: anthropic.claude-haiku-4-5-20251001-v1:0
    bedrock_inference_profile_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
  claude_sonnet:
    inference: claude
    model_id: claude-sonnet-4-5
    display: claude-sonnet-4-5
    bedrock_model_id: anthropic.claude-sonnet-4-5-20250929-v1:0
    bedrock_inference_profile_id: us.anthropic.claude-sonnet-4-5-20250929-v1:0

stack_groups:
  modelark:
    display: ModelArk
    allowed_clouds: [local, aws, gcp]
  openai_claude:
    display: OpenAI embed + Claude
    allowed_clouds: [local, aws, gcp]

stacks:
  - embedding: skylark_2048
    chat: deepseek_flash
    group: modelark
  - embedding: skylark_2048
    chat: deepseek_pro
    group: modelark
  - embedding: skylark_2048
    chat: seed_lite
    group: modelark
  - embedding: skylark_2048
    chat: seed_pro
    group: modelark
  - embedding: openai_1536
    chat: claude_haiku
    group: openai_claude
  - embedding: openai_1536
    chat: claude_sonnet
    group: openai_claude
